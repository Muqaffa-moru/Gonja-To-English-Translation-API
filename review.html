<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gonja review</title>
<style>
  :root{--bg:#f6f5f1;--card:#fff;--ink:#1d1d1b;--mute:#6b6a64;--line:#e2e0d8;
        --ok:#1d7a4d;--fix:#9a6a00;--bad:#b3261e;--accent:#1f4fd8}
  @media (prefers-color-scheme:dark){
    :root{--bg:#161614;--card:#212120;--ink:#f1f0ea;--mute:#a09f97;--line:#363633;
          --ok:#4cc38a;--fix:#e0b04a;--bad:#f2766d;--accent:#7da2ff}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .wrap{max-width:560px;margin:0 auto;padding:16px}
  h1{font-size:20px;margin:8px 0 4px}
  p.sub{color:var(--mute);margin:0 0 16px;font-size:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
  label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
  input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);
                 border-radius:10px;padding:12px}
  textarea{min-height:90px;resize:vertical}
  button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:14px 16px;cursor:pointer;color:#fff;width:100%}
  button:disabled{opacity:.5}
  .primary{background:var(--accent)} .ok{background:var(--ok)} .fix{background:var(--fix)} .bad{background:var(--bad)}
  .ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  .row{display:flex;gap:10px;margin-top:10px} .row>*{flex:1}
  .tag{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);margin-bottom:2px}
  .text{font-size:22px;line-height:1.3;margin:0 0 16px;overflow-wrap:anywhere}
  .meta{font-size:13px;color:var(--mute);margin-top:4px}
  .bar{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin-bottom:10px}
  .progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:14px}
  .progress>div{height:100%;background:var(--ok);width:0}
  #toast{position:fixed;left:16px;right:16px;bottom:16px;max-width:528px;margin:0 auto;padding:12px 14px;
         border-radius:12px;background:var(--ink);color:var(--bg);display:none;font-size:14px}
  .hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>Gonja review</h1>
  <p class="sub">Check that each Gonja sentence correctly says what the English says.</p>

  <!-- 1. sign in -->
  <div id="login" class="card">
    <label for="name">Your name (you never review your own pairs)</label>
    <input id="name" autocomplete="name" placeholder="e.g. Kofi">
    <label for="key">Reviewer key</label>
    <input id="key" type="password" autocomplete="off" placeholder="from the project owner">
    <div class="row"><button class="primary" id="start">Start reviewing</button></div>
  </div>

  <!-- 2. review -->
  <div id="review" class="hide">
    <div class="bar"><span id="left"></span><span id="done"></span></div>
    <div class="progress"><div id="pbar"></div></div>

    <div class="card" id="pair">
      <div class="tag">English</div>
      <p class="text" id="en"></p>
      <div class="tag">Gonja</div>
      <p class="text" id="gjn"></p>
      <div class="meta" id="by"></div>

      <div id="actions">
        <div class="row"><button class="ok" id="approve">✅ Correct</button></div>
        <div class="row">
          <button class="fix" id="fixBtn">✏️ Fix it</button>
          <button class="bad" id="rejectBtn">🚫 Wrong</button>
        </div>
        <div class="row"><button class="ghost" id="skip">⏭ Skip for now</button></div>
      </div>

      <div id="fixBox" class="hide">
        <label for="fixText">Type the correct Gonja</label>
        <textarea id="fixText"></textarea>
        <div class="row">
          <button class="ghost" id="fixCancel">Cancel</button>
          <button class="fix" id="fixSave">Save fix</button>
        </div>
      </div>
    </div>
    <div class="meta">✅ approves it as it is · ✏️ replaces it with your version · 🚫 removes it from the dataset.</div>
  </div>

  <div id="empty" class="card hide"><strong>All done 🎉</strong><p class="sub">Nothing left to review right now. Thank you!</p>
    <div class="row"><button class="ghost" id="reload">Check again</button></div></div>
</div>
<div id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
let key = "", name = "", queue = [], reviewedThisSession = 0, startTotal = 0, busy = false;

function store(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return sessionStorage.getItem(k) || ""; } catch (e) { return ""; } }

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(toast.h); toast.h = setTimeout(() => { t.style.display = "none"; }, 3500);
}

async function api(path, options = {}) {
  const res = await fetch(path, Object.assign({ headers: { "X-API-Key": key, "Content-Type": "application/json" } }, options));
  let body = null;
  try { body = await res.json(); } catch (e) {}
  if (!res.ok) throw new Error((body && body.detail) || ("Error " + res.status));
  return body;
}

async function loadQueue() {
  queue = await api("/pairs?verified=false&limit=500&exclude_contributor=" + encodeURIComponent(name));
  startTotal = queue.length + reviewedThisSession;
  render();
}

function show(which) {
  $("login").classList.toggle("hide", which !== "login");
  $("review").classList.toggle("hide", which !== "review");
  $("empty").classList.toggle("hide", which !== "empty");
}

function render() {
  if (!queue.length) { show("empty"); return; }
  show("review");
  const p = queue[0];
  $("en").textContent = p.en;
  $("gjn").textContent = p.gjn;
  $("by").textContent = "Contributed by " + (p.contributor || "unknown");
  $("fixBox").classList.add("hide");
  $("actions").classList.remove("hide");
  $("left").textContent = queue.length + " left to review";
  $("done").textContent = reviewedThisSession + " reviewed this session";
  $("pbar").style.width = (startTotal ? Math.round(100 * reviewedThisSession / startTotal) : 0) + "%";
}

async function act(path, body, okMsg) {
  if (busy || !queue.length) return;
  busy = true;
  document.querySelectorAll("button").forEach((b) => (b.disabled = true));
  try {
    await api("/pairs/" + queue[0].id + path, { method: "POST", body: JSON.stringify(body) });
    queue.shift(); reviewedThisSession++;
    toast(okMsg);
  } catch (e) {
    toast(e.message);
  } finally {
    busy = false;
    document.querySelectorAll("button").forEach((b) => (b.disabled = false));
    render();
  }
}

$("start").onclick = async () => {
  name = $("name").value.trim(); key = $("key").value.trim();
  if (!name || !key) { toast("Please enter your name and the reviewer key."); return; }
  try { await loadQueue(); store("gr_name", name); store("gr_key", key); }
  catch (e) { toast(e.message); }
};
$("approve").onclick = () => act("/verify", { reviewer: name }, "Approved ✅");
$("rejectBtn").onclick = () => { if (confirm("Mark this pair as wrong and remove it?")) act("/reject", { reviewer: name }, "Removed 🚫"); };
$("skip").onclick = () => { if (queue.length > 1) queue.push(queue.shift()); render(); };
$("fixBtn").onclick = () => { $("fixText").value = queue[0].gjn; $("actions").classList.add("hide"); $("fixBox").classList.remove("hide"); $("fixText").focus(); };
$("fixCancel").onclick = () => render();
$("fixSave").onclick = () => {
  const text = $("fixText").value.trim();
  if (!text) { toast("Type the corrected Gonja first."); return; }
  act("/correct", { reviewer: name, gonja: text }, "Fix saved ✏️");
};
$("reload").onclick = async () => { try { await loadQueue(); } catch (e) { toast(e.message); } };

// resume a session on page refresh
name = load("gr_name"); key = load("gr_key");
if (name && key) { $("name").value = name; $("key").value = key; loadQueue().catch(() => show("login")); }
</script>
</body>
</html>
